<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KK ORGANISATION</title><style>
:root{--navy:#14233f;--blue:#315efb;--bg:#f4f7fc;--text:#202b40;--muted:#748097;--line:#e7ebf3}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--navy);color:#fff;padding:22px 14px;flex-shrink:0}.brand{font-size:20px;font-weight:800;padding:8px 10px 25px;line-height:1.5}.brand span{display:block;color:#aebeff;font-size:11px;letter-spacing:2px}.nav-label{font-size:10px;color:#9aa9c8;letter-spacing:1.5px;padding:12px}.nav{width:100%;border:0;background:transparent;color:#d9e1f3;padding:12px;border-radius:9px;text-align:left;margin:3px 0}.nav:hover,.nav.active{background:var(--blue);color:#fff}.nav-group{display:flex;justify-content:space-between;align-items:center}.arrow{margin-left:auto}.submenu{padding-left:12px;border-left:1px solid #52617b;margin-left:14px}.nav.sub{font-size:12px;padding:11px 8px}.main{min-width:0;flex:1}.topbar{height:70px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.topbar small,.muted{color:var(--muted)}.topbar small{font-size:12px}.menu-btn{display:none}.content{padding:28px;max-width:1500px;margin:auto}h1{font-size:25px;margin:0 0 8px}h2{font-size:17px;margin:0 0 18px}.muted{font-size:13px;line-height:1.6}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:25px 0}.card,.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 4px 16px #1d315008}.card .label{font-size:13px;color:var(--muted)}.card .number{font-size:29px;font-weight:800;margin-top:14px}.card .icon{float:right;background:#eef2ff;border-radius:10px;padding:10px}.panel{margin-top:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}.btn{border:0;border-radius:8px;background:var(--blue);color:#fff;padding:11px 15px;font-weight:700}.btn.secondary{background:#edf1ff;color:#254bd0}.btn.danger{background:#fff0f0;color:#c33131}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field select,.field textarea,.search{width:100%;padding:12px;border:1px solid #dce2ed;border-radius:8px;background:white}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:13px 12px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f7f9fd;color:#5d6980;font-size:11px;text-transform:uppercase}.empty{text-align:center;color:var(--muted);padding:28px}.notice{padding:12px 14px;background:#fff8e8;border:1px solid #f4e4b8;color:#7d5a14;border-radius:9px;font-size:12px;line-height:1.6;margin-top:16px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:28px}.checks{display:flex;flex-wrap:wrap;gap:10px}.checks label{display:flex;gap:6px;align-items:center;font-size:13px;background:#f7f9fd;padding:9px;border-radius:7px}.id-preview{width:330px;max-width:100%;min-height:190px;border:2px solid #d8b34b;border-radius:12px;padding:15px;background:linear-gradient(140deg,#fff,#f4f6fb);margin:12px 0}.id-preview h3{text-align:center;font-size:14px;margin:0 0 12px}.id-preview p{font-size:11px;margin:7px 0}.preview-photo{float:right;width:55px;height:65px;border:1px dashed #9ba6b8;display:flex;align-items:center;justify-content:center;font-size:10px;color:#748097}.preview-back{border-top:1px dashed #bbb;margin-top:12px;padding-top:8px;font-size:11px}@media(max-width:900px){.sidebar{width:220px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:20px}}@media(max-width:650px){.sidebar{position:fixed;z-index:5;left:-260px;top:0;bottom:0;transition:.2s;overflow-y:auto}.sidebar.open{left:0}.menu-btn{display:block;border:0;background:white;font-size:22px}.topbar{padding:0 15px}.content{padding:17px}.form-grid{grid-template-columns:1fr}}
</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand">KK ORGANISATION<span>MANAGEMENT PORTAL</span></div><div class="nav-label">MAIN MENU</div><button class="nav active" data-page="Dashboard">▦ &nbsp; Dashboard</button><button class="nav nav-group" data-toggle="schoolMenu">🏫 &nbsp; School <span class="arrow">⌄</span></button><div class="submenu" id="schoolMenu" hidden><button class="nav sub" data-page="Add New School">＋ Add New School</button><button class="nav sub" data-page="School Record">▤ School Record</button></div><button class="nav nav-group" data-toggle="organizationMenu">🏢 &nbsp; Organization <span class="arrow">⌄</span></button><div class="submenu" id="organizationMenu" hidden><button class="nav sub" data-page="Add New Organization">＋ Add New Organization</button><button class="nav sub" data-page="Organization Record">▤ Organization Record</button><button class="nav sub" data-page="Wallet History">◉ Wallet History</button></div><button class="nav nav-group" data-toggle="staffMenu">♙ &nbsp; Emp/Staff <span class="arrow">⌄</span></button><div class="submenu" id="staffMenu" hidden><button class="nav sub" data-page="Emp/Staff Record">▤ Emp/Staff Record</button></div><button class="nav nav-group" data-toggle="studentMenu">🎓 &nbsp; Student <span class="arrow">⌄</span></button><div class="submenu" id="studentMenu" hidden><button class="nav sub" data-page="Student Record">▤ Student Record</button></div><div class="nav-label">SETTINGS</div><button class="nav nav-group" data-toggle="settingsMenu">⚙ &nbsp; Settings <span class="arrow">⌄</span></button><div class="submenu" id="settingsMenu" hidden><button class="nav sub" data-page="All Passwords">▣ All Passwords</button><button class="nav sub" data-page="Change Password">⚙ Change Password</button><button class="nav sub" data-page="Login History">◷ Login History</button><button class="nav sub" data-page="Website Visit History">↗ Website Visit History</button></div><div class="nav-label">OTHER</div><button class="nav" data-page="Public Website">⌂ &nbsp; Go to Website</button><button class="nav" id="logoutBtn">⇥ &nbsp; Logout</button></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu-btn" id="menuBtn">☰</button><div><strong id="topTitle">Dashboard</strong><br><small>KK ORGANISATION</small></div></div><div style="text-align:right"><strong>Administrator</strong><br><small>Portal Preview</small></div></header><div class="content"><section id="pageContent"></section><div class="footer">© <span id="year"></span> KK ORGANISATION · Management Portal</div></div></main></div><div id="toast" style="display:none;position:fixed;bottom:22px;right:22px;background:#172844;color:white;padding:14px;border-radius:10px;z-index:10"></div>
<script>
const $=s=>document.querySelector(s),pageContent=$("#pageContent");let currentPage="Dashboard";let records={schools:[],organizations:[],staff:[],students:[],wallet:[],logins:[],visits:[]};
function toast(m){let t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2800)}function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function field(l,n,t="text",r=false,o=[]){let x=t==="select"?`<select name="${n}" ${r?"required":""}><option value="">Select ${l}</option>${o.map(a=>`<option>${esc(a)}</option>`).join("")}</select>`:t==="textarea"?`<textarea name="${n}" rows="3" ${r?"required":""}></textarea>`:`<input name="${n}" type="${t}" ${r?"required":""}>`;return `<div class="field"><label>${l}${r?" *":""}</label>${x}</div>`}
function formPanel(title,fields){return `<div class="panel"><h2>${title}</h2><form id="recordForm"><div class="form-grid">${fields.join("")}</div><div class="actions"><button class="btn">Save Record</button><button class="btn secondary" type="reset">Reset</button></div></form></div>`}
function tablePanel(title,key,cols){let a=records[key]||[];return `<div class="panel"><div class="panel-head"><h2>${title}</h2><input class="search" id="tableSearch" placeholder="Search records..." style="max-width:250px"></div><div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join("")}<th>Action</th></tr></thead><tbody id="tableBody">${a.length?a.map((r,i)=>row(r,i,cols,key)).join(""):`<tr><td colspan="${cols.length+1}" class="empty">No records yet.</td></tr>`}</tbody></table></div></div>`}function row(r,i,cols,key){return `<tr>${cols.map(c=>`<td>${esc(r[c[0]]||"—")}</td>`).join("")}<td><button class="btn danger" onclick="del('${key}',${i})">Delete</button></td></tr>`}function del(k,i){records[k].splice(i,1);render();toast("Record deleted")}
function dashboard(){return `<h1>Dashboard</h1><div class="muted">Welcome to KK ORGANISATION. Manage schools, organizations, staff and students.</div><div class="cards">${[['Schools',records.schools.length,'🏫'],['Organizations',records.organizations.length,'🏢'],['Staff Members',records.staff.length,'👥'],['Students',records.students.length,'🎓']].map(x=>`<div class="card"><span class="icon">${x[2]}</span><div class="label">${x[0]}</div><div class="number">${x[1]}</div></div>`).join("")}</div><div class="panel"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="go('Add New School')">＋ Add New School</button><button class="btn" onclick="go('Add New Organization')">＋ Add Organization</button><button class="btn secondary" onclick="go('Student Record')">View Students</button><button class="btn secondary" onclick="go('Emp/Staff Record')">View Staff</button></div></div><div class="notice">Prototype mode: records stay in this browser session only. Secure login, shared database and permanent storage are not connected yet.</div>`}
const configs={"Add New School":{key:"schools",title:"Add New School",fields:[field("Organization Type","type","select",true,["School","College","Institute","Other"]),field("Organization / School Name","name","text",true),field("Owner / Contact Name","owner","text",true),field("Mobile Number","mobile","tel",true),field("Alternate Contact","alternate","tel"),field("Email Address","email","email"),field("State / Region","state"),field("District","district"),field("PIN Code","pincode"),field("Staff / Student Type","userType","select",true,["Both","Staff","Student"]),field("Full Address","address","textarea")]}, "Add New Organization":{key:"organizations",title:"Add New Organization",fields:[field("Organization Name","name","text",true),field("Organization Type","type","select",true,["School","College","Institute","Company","Other"]),field("Owner / Contact Name","owner","text",true),field("Mobile Number","mobile","tel",true),field("Email Address","email","email"),field("State / Region","state"),field("District","district"),field("PIN Code","pincode"),field("Address","address","textarea")]}};
const lists={"School Record":{key:"schools",title:"School Records",cols:[["name","School Name"],["type","Type"],["owner","Contact"],["mobile","Mobile"],["district","District"]]},"Organization Record":{key:"organizations",title:"Organization Records",cols:[["name","Organization"],["type","Type"],["owner","Contact"],["mobile","Mobile"],["district","District"]]},"Emp/Staff Record":{key:"staff",title:"Employee / Staff Records",cols:[["name","Name"],["empid","Employee ID"],["department","Department"],["designation","Designation"],["mobile","Mobile"]]},"Student Record":{key:"students",title:"Student Records",cols:[["name","Name"],["studentid","Student ID"],["class","Class"],["course","Course"],["mobile","Mobile"]]},"Wallet History":{key:"wallet",title:"Wallet History",cols:[["amount","Amount"],["type","Type"],["balance","Balance"],["date","Date"],["userId","User ID"],["organization","Organization"],["remark","Remark"]]},"Login History":{key:"logins",title:"Login History",cols:[["user","User"],["date","Date"],["status","Status"]]},"Website Visit History":{key:"visits",title:"Website Visit History",cols:[["page","Page"],["date","Date"],["note","Details"]]}};
const stu=["Adrs","Class","Course","D.O.B.","F. Name","Mob","Name","Section","Stu. Id","Validity"],emp=["Adrs","Department","Designation","Email","Emp ID","Expired Date","Joining Date","Mob","Name"];
function idSettings(){return `<h1>ID Card Configuration</h1><div class="muted">Set up student and employee ID card layout, fields and printing options.</div><div class="panel"><h2>Card Type & Layout</h2><form id="idForm"><div class="form-grid">${field("Apply Settings For","cardType","select",true,["Student ID Card","Employee / Staff ID Card"])}${field("Organization / School Name","orgName","text",true)}${field("Card Orientation","orientation","select",true,["Horizontal","Vertical"])}${field("Print Side","side","select",true,["Single Side","Both Sides"])}${field("Photo Alignment","photoAlign","select",true,["Left","Center","Right"])}${field("Photo Shape","photoShape","select",true,["Square","Rectangle","Circle"])}${field("Card Header / Main Title","headerTitle","text",true)}${field("Validity Text","validity")}${field("Upload Logo (optional)","logo","file")}${field("Upload Signature (optional)","signature","file")}</div><h3 class="subheading">Choose fields to show (maximum 6)</h3><div id="headerChoices" class="checks"></div><div class="actions"><button class="btn">Save ID Card Settings</button><button class="btn secondary" type="button" id="previewBtn">Update Preview</button><button class="btn" type="button" id="printBtn">Print Preview</button></div></form></div><div class="panel"><h2>Live Sample Preview</h2><div id="idPreview" class="id-preview"><div class="preview-photo">PHOTO</div><h3>KK ORGANISATION</h3><p>Name: Sample Name</p><p>ID: SAMPLE-001</p><div class="preview-back">Validity: —</div></div><div class="muted">Sample preview only; settings and uploaded images are not permanently stored.</div></div>`}
function setupId(){let f=$("#idForm"),ch=$("#headerChoices");function fill(){let arr=f.elements.cardType.value==="Employee / Staff ID Card"?emp:stu;ch.innerHTML=arr.map((v,i)=>`<label><input type="checkbox" value="${v}" ${i<6?"checked":""}>${v}</label>`).join("");ch.querySelectorAll("input").forEach(x=>x.addEventListener("change",()=>{if(ch.querySelectorAll(":checked").length>6){x.checked=false;toast("Maximum 6 fields select kar sakte ho")}}))}fill();f.elements.cardType.addEventListener("change",fill);function preview(){let d=new FormData(f),chosen=[...ch.querySelectorAll(":checked")].map(x=>x.value);$("#idPreview").innerHTML=`<div class="preview-photo">PHOTO</div><h3>${esc(d.get("headerTitle")||d.get("orgName")||"KK ORGANISATION")}</h3>${chosen.map(v=>`<p>${esc(v)}: Sample ${esc(v)}</p>`).join("")}<div class="preview-back">Orientation: ${esc(d.get("orientation")||"Horizontal")} · ${esc(d.get("side")||"Single Side")}<br>Validity: ${esc(d.get("validity")||"—")}</div>`}$("#previewBtn").onclick=preview;f.onsubmit=e=>{e.preventDefault();preview();toast("Preview updated. Permanent save requires a backend.")};$("#printBtn").onclick=()=>{preview();window.print()}}
function render(){$("#topTitle").textContent=currentPage;document.querySelectorAll(".nav[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===currentPage));if(currentPage==="Dashboard"){pageContent.innerHTML=dashboard();return}if(configs[currentPage]){let c=configs[currentPage],ln=currentPage==="Add New School"?"School Record":"Organization Record";pageContent.innerHTML=`<h1>${c.title}</h1><div class="muted">Enter details below to add a record.</div>${formPanel(c.title,c.fields)}${tablePanel("Recently Added",c.key,lists[ln].cols)}<div class="panel"><div class="panel-head"><h2>ID Card Settings</h2><button class="btn secondary" onclick="go('ID Card Configuration')">Open ID Card Configuration</button></div><p class="muted">Configure card orientation, photo layout, selected fields and print options.</p></div>`;bindForm(c.key);bindSearch(c.key,lists[ln].cols);return}if(currentPage==="ID Card Configuration"){pageContent.innerHTML=idSettings();setupId();return}if(currentPage==="Add Staff"||currentPage==="Add Student"){let staff=currentPage==="Add Staff";pageContent.innerHTML=`<h1>${staff?"Add Employee / Staff":"Add Student"}</h1>${formPanel(staff?"Staff Details":"Student Details",staff?[field("Full Name","name","text",true),field("Employee ID","empid","text",true),field("Department","department"),field("Designation","designation"),field("Mobile Number","mobile","tel"),field("Email","email","email")]:[field("Full Name","name","text",true),field("Student ID","studentid","text",true),field("Class","class"),field("Course","course"),field("Section","section"),field("Father's Name","father"),field("Mobile Number","mobile","tel"),field("Address","address","textarea")])}`;bindForm(staff?"staff":"students");return}if(lists[currentPage]){let c=lists[currentPage];pageContent.innerHTML=`<h1>${c.title}</h1><div class="muted">Search and manage available records.</div>${tablePanel(c.title,c.key,c.cols)}${["Emp/Staff Record","Student Record"].includes(currentPage)?`<div class="actions"><button class="btn" onclick="go('${currentPage==="Emp/Staff Record"?"Add Staff":"Add Student"}')">＋ Add New</button><button class="btn secondary" onclick="go('ID Card Configuration')">ID Card Configuration</button></div>`:""}`;bindSearch(c.key,c.cols);return}if(currentPage==="All Passwords"){pageContent.innerHTML=`<h1>Account Management</h1><div class="panel"><h2>Secure Account Management</h2><p class="muted">Passwords should not be displayed in plain text. A full version should use secure reset and role-based access.</p></div>`;return}if(currentPage==="Change Password"){pageContent.innerHTML=`<h1>Change Password</h1><div class="panel"><p class="muted">Secure password changes require an authentication backend. This prototype does not store real passwords.</p></div>`;return}if(currentPage==="Public Website"){pageContent.innerHTML=`<h1>KK ORGANISATION</h1><div class="panel"><h2>Welcome to KK ORGANISATION</h2><p class="muted">School, organization, staff and student management.</p><button class="btn" onclick="go('Dashboard')">Return to Dashboard</button></div>`;return}pageContent.innerHTML=`<h1>${esc(currentPage)}</h1><div class="panel"><p class="muted">This feature will be connected in a later stage.</p></div>`}
function bindForm(k){let f=$("#recordForm");if(!f)return;f.onsubmit=e=>{e.preventDefault();records[k].push(Object.fromEntries(new FormData(f).entries()));render();toast("Record added successfully")}}function bindSearch(k,cols){let i=$("#tableSearch");if(!i)return;i.oninput=()=>{let q=i.value.toLowerCase(),a=records[k].filter(r=>cols.some(c=>String(r[c[0]]||"").toLowerCase().includes(q)));$("#tableBody").innerHTML=a.length?a.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]]||"—")}</td>`).join("")}<td>Preview record</td></tr>`).join(""):`<tr><td colspan="${cols.length+1}" class="empty">No matching records</td></tr>`}}
function go(p){currentPage=p;render();$("#sidebar").classList.remove("open");let map={"Add New School":"schoolMenu","School Record":"schoolMenu","Add New Organization":"organizationMenu","Organization Record":"organizationMenu","Wallet History":"organizationMenu","Emp/Staff Record":"staffMenu","Add Staff":"staffMenu","Student Record":"studentMenu","Add Student":"studentMenu","All Passwords":"settingsMenu","Change Password":"settingsMenu","Login History":"settingsMenu","Website Visit History":"settingsMenu"};if(map[p]){let m=$("#"+map[p]);m.hidden=false;document.querySelector(`[data-toggle="${map[p]}"]`).classList.add("expanded")}}
document.querySelectorAll(".nav[data-page]").forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{let m=$("#"+b.dataset.toggle),open=m.hidden;document.querySelectorAll(".submenu").forEach(x=>x.hidden=true);document.querySelectorAll(".nav-group").forEach(x=>x.classList.remove("expanded"));if(open){m.hidden=false;b.classList.add("expanded")}});$("#menuBtn").onclick=()=>$("#sidebar").classList.toggle("open");$("#logoutBtn").onclick=()=>{go("Dashboard");toast("Preview only: no real login session")};$("#year").textContent=new Date().getFullYear();render();
</script></body></html>
