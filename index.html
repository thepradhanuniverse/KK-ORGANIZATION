</style></head><body><div class="layout"><aside class="sidebar" id="sidebar"><div class="brand">KK ORGANISATION<span>MANAGEMENT PORTAL</span></div><div class="nav-label">MAIN MENU</div><button class="nav active" data-page="Dashboard">▦ &nbsp; Dashboard</button><button class="nav nav-group" data-toggle="schoolMenu">🏫 &nbsp; School <span class="arrow">⌄</span></button><div class="submenu" id="schoolMenu" hidden><button class="nav sub" data-page="Add New School">＋ Add New School</button><button class="nav sub" data-page="School Record">▤ School Record</button></div><button class="nav nav-group" data-toggle="organizationMenu">🏢 &nbsp; Organization <span class="arrow">⌄</span></button><div class="submenu" id="organizationMenu" hidden><button class="nav sub" data-page="Add New Organization">＋ Add New Organization</button><button class="nav sub" data-page="Organization Record">▤ Organization Record</button><button class="nav sub" data-page="Wallet History">◉ Wallet History</button></div><button class="nav nav-group" data-toggle="staffMenu">♙ &nbsp; Emp/Staff <span class="arrow">⌄</span></button><div class="submenu" id="staffMenu" hidden><button class="nav sub" data-page="Emp/Staff Record">▤ Emp/Staff Record</button></div><button class="nav nav-group" data-toggle="studentMenu">🎓 &nbsp; Student <span class="arrow">⌄</span></button><div class="submenu" id="studentMenu" hidden><button class="nav sub" data-page="Student Record">▤ Student Record</button></div><div class="nav-label">SETTINGS</div><button class="nav nav-group" data-toggle="settingsMenu">⚙ &nbsp; Settings <span class="arrow">⌄</span></button><div class="submenu" id="settingsMenu" hidden><button class="nav sub" data-page="All Passwords">▣ All Passwords</button><button class="nav sub" data-page="Change Password">⚙ Change Password</button><button class="nav sub" data-page="Login History">◷ Login History</button><button class="nav sub" data-page="Website Visit History">↗ Website Visit History</button><button class="nav sub" data-page="ID Card Configuration">▣ ID Card Settings</button></div><div class="nav-label">OTHER</div><button class="nav" data-page="Public Website">⌂ &nbsp; Go to Website</button><button class="nav" id="logoutBtn">⇥ &nbsp; Logout</button></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:12px"><button class="menu-btn" id="menuBtn">☰</button><div><strong id="topTitle">Dashboard</strong><br><small>KK ORGANISATION</small></div></div><div style="text-align:right"><strong>Administrator</strong><br><small>Frontend preview</small></div></header><div class="content"><section id="pageContent"></section><div class="footer">© <span id="year"></span> KK ORGANISATION · Management Portal</div></div></main></div><div id="toast" style="display:none;position:fixed;bottom:22px;right:22px;background:#172844;color:white;padding:14px;border-radius:10px;z-index:10;max-width:90vw"></div>
<script>
const $=s=>document.querySelector(s), pageContent=$('#pageContent');let currentPage='Dashboard',editState=null;
const defaults={schools:[],organizations:[],staff:[],students:[],wallet:[],logins:[],visits:[]};let records={};function loadData(){Object.keys(defaults).forEach(k=>{try{records[k]=JSON.parse(localStorage.getItem('kkorg_'+k))||[]}catch{records[k]=[]}})}function saveData(k){localStorage.setItem('kkorg_'+k,JSON.stringify(records[k]))}loadData();
function toast(m){let t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',3000)}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function stamp(){return new Date().toLocaleString()}
function field(l,n,t='text',r=false,o=[]){let x=t==='select'?`<select name="${n}" ${r?'required':''}><option value="">Select ${l}</option>${o.map(a=>`<option>${esc(a)}</option>`).join('')}</select>`:t==='textarea'?`<textarea name="${n}" rows="3" ${r?'required':''}></textarea>`:`<input name="${n}" type="${t}" ${r?'required':''} ${t==='file'?'accept="image/*"':''}>`;return `<div class="field"><label>${l}${r?' *':''}</label>${x}</div>`}
function formPanel(title,fields,button='Save Record'){return `<div class="panel"><h2>${title}</h2><form id="recordForm"><div class="form-grid">${fields.join('')}</div><div class="actions"><button class="btn">${button}</button><button class="btn secondary" type="reset">Reset</button></div></form></div>`}
function tablePanel(title,key,cols,opts={}){let a=records[key]||[];let q=opts.filters?`<div class="form-grid" style="margin-bottom:12px">${field('From Date','from','date')}${field('To Date','to','date')}${field('Type','typeFilter','select',false,['Credit','Debit','Login','Logout'])}</div>`:'';return `<div class="panel"><div class="panel-head"><h2>${title}</h2><input class="search" id="tableSearch" placeholder="Search records..." style="max-width:260px"></div>${q}<div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c[1]}</th>`).join('')}<th>Action</th></tr></thead><tbody id="tableBody">${a.length?a.map((r,i)=>row(r,i,cols,key)).join(''):`<tr><td colspan="${cols.length+1}" class="empty">No records yet.</td></tr>`}</tbody></table></div></div>`}
function row(r,i,cols,key){return `<tr>${cols.map(c=>`<td>${esc(r[c[0]]||'—')}</td>`).join('')}<td><button class="btn secondary" onclick="editRecord('${key}',${i})">Edit</button> <button class="btn danger" onclick="delRecord('${key}',${i})">Delete</button></td></tr>`}
function delRecord(k,i){if(!confirm('Delete this record?'))return;records[k].splice(i,1);saveData(k);render();toast('Record deleted')}
function editRecord(k,i){let r=records[k][i];if(!r)return;let page={schools:'Add New School',organizations:'Add New Organization',staff:'Add Staff',students:'Add Student'}[k];if(!page){toast('This history record cannot be edited');return}editState={key:k,index:i};go(page);let f=$('#recordForm');if(f)Object.entries(r).forEach(([n,v])=>{if(f.elements[n]&&f.elements[n].type!=='file')f.elements[n].value=v});let b=f?.querySelector('button[type="submit"],button:not([type])');if(b)b.textContent='Update Record'}
function dashboard(){return `<h1>Dashboard</h1><div class="muted">Welcome to KK ORGANISATION. Manage schools, organizations, staff and students from one place.</div><div class="cards">${[['Schools',records.schools.length,'🏫'],['Organizations',records.organizations.length,'🏢'],['Staff Members',records.staff.length,'👥'],['Students',records.students.length,'🎓']].map(x=>`<div class="card"><span class="icon">${x[2]}</span><div class="label">${x[0]}</div><div class="number">${x[1]}</div></div>`).join('')}</div><div class="panel"><h2>Quick Actions</h2><div class="actions"><button class="btn" onclick="go('Add New School')">＋ Add New School</button><button class="btn" onclick="go('Add New Organization')">＋ Add Organization</button><button class="btn secondary" onclick="go('Student Record')">View Students</button><button class="btn secondary" onclick="go('Emp/Staff Record')">View Staff</button><button class="btn secondary" onclick="go('ID Card Configuration')">ID Card Settings</button></div></div><div class="notice">Frontend preview: records are saved in this browser only. This is not a shared database and is not suitable for storing real passwords or sensitive student data.</div>`}
const configs={'Add New School':{key:'schools',title:'Add New School',fields:[field('Organization Type','type','select',true,['School','College','Institute','Other']),field('Organization / School Name','name','text',true),field('Owner / Contact Name','owner','text',true),field('Mobile Number','mobile','tel',true),field('Alternate Contact','alternate','tel'),field('Email Address','email','email'),field('State','state','select',true,['Uttar Pradesh','Delhi','Haryana','Rajasthan','Madhya Pradesh','Bihar','Punjab','Uttarakhand']),field('Region','region','select',true,[]),field('District','district','select',true,[]),field('PIN Code','pincode'),field('Staff / Student Type','userType','select',true,['Both','Staff','Student']),field('Full Address','address','textarea')]},'Add New Organization':{key:'organizations',title:'Add New Organization',fields:[field('Organization Name','name','text',true),field('Organization Type','type','select',true,['School','College','Institute','Company','Other']),field('Owner / Contact Name','owner','text',true),field('Mobile Number','mobile','tel',true),field('Email Address','email','email'),field('State / Region','state'),field('District','district'),field('PIN Code','pincode'),field('Address','address','textarea')]}};
const lists={'School Record':{key:'schools',title:'School Records',cols:[['name','School Name'],['type','Type'],['owner','Contact'],['mobile','Mobile'],['district','District'],['created','Created']]},'Organization Record':{key:'organizations',title:'Organization Records',cols:[['name','Organization'],['type','Type'],['owner','Contact'],['mobile','Mobile'],['district','District'],['created','Created']]},'Emp/Staff Record':{key:'staff',title:'Employee / Staff Records',cols:[['name','Name'],['empid','Employee ID'],['department','Department'],['designation','Designation'],['mobile','Mobile'],['created','Created']]},'Student Record':{key:'students',title:'Student Records',cols:[['name','Name'],['studentid','Student ID'],['class','Class'],['course','Course'],['mobile','Mobile'],['created','Created']]},'Wallet History':{key:'wallet',title:'Wallet History',cols:[['amount','Amount'],['type','Type'],['balance','Balance'],['date','Date'],['userId','User ID'],['organization','Organization'],['remark','Remark']]},'Login History':{key:'logins',title:'Login History',cols:[['user','User'],['date','Date'],['status','Status']]},'Website Visit History':{key:'visits',title:'Website Visit History',cols:[['page','Page'],['date','Date'],['note','Details']]}};
const stu=['Adrs','Class','Course','D.O.B.','F. Name','Mob','Name','Section','Stu. Id','Validity','Blood Group','Address','Gender','Session','Photo','Roll No.','Father Mob','Mother Name'],emp=['Adrs','Department','Designation','Email','Emp ID','Expired Date','Joining Date','Mob','Name','Qualification','Blood Group','Gender','Photo','Address','Date of Birth','Emergency Contact','Experience','Validity'];
function idSettings(){return `<div class="panel"><div class="panel-head"><h2>ID Card & Report Card Settings</h2><span class="pill">Student + Employee/Staff</span></div><form id="idForm"><div class="split"><section class="header-config"><div class="section-bar">Employee / Staff Headers <span>(select the fields to show)</span></div><div class="table-wrap"><table><thead><tr><th>Select</th><th>Sr. No.</th><th>Header</th><th>Header Color</th><th>Value Color</th><th>Header Bold</th><th>Value Bold</th></tr></thead><tbody id="empHeaderRows"></tbody></table></div></section><section class="header-config"><div class="section-bar">Student Headers <span>(select the fields to show)</span></div><div class="table-wrap"><table><thead><tr><th>Select</th><th>Sr. No.</th><th>Header</th><th>Header Color</th><th>Value Color</th><th>Header Bold</th><th>Value Bold</th></tr></thead><tbody id="stuHeaderRows"></tbody></table></div></section></div><div class="form-grid" style="margin-top:18px">${field('ID Card Photo Alignment','photoAlign','select',true,['Left','Center','Right'])}${field('ID Card Photo Shape','photoShape','select',true,['Square','Rectangle','Circle'])}${field('ID Card Type','cardType','select',true,['Student ID Card','Employee / Staff ID Card'])}${field('ID Card Print Side','side','select',true,['Single Side','Both Sides'])}${field('Card Orientation','orientation','select',true,['Horizontal','Vertical'])}${field('Organization / School Name','orgName','text',true)}${field('Card Header / Main Title','headerTitle','text',true)}${field('Validity Text','validity')}${field('ID Card Front Image (JPG/JPEG)','idFront','file',true)}${field('Report Card Front Image (JPG/JPEG)','reportFront','file',true)}${field('Report Card Back Image (JPG/JPEG)','reportBack','file',true)}</div><div class="actions"><button class="btn">Submit / Save Settings</button><button class="btn secondary" type="button" id="previewBtn">Update Preview</button><button class="btn" type="button" id="printBtn">Print Preview</button><button class="btn light" type="reset" id="idResetBtn">Reset</button></div></form></div><div class="panel print-panel"><h2>Live ID Card Preview</h2><div id="idPreview" class="id-preview"><div class="preview-photo">PHOTO</div><h3>KK ORGANISATION</h3><p>Name: Sample Name</p><p>ID: SAMPLE-001</p></div><div class="muted">Settings save in this browser only. Uploaded images are selected for this session; shared storage requires a backend.</div></div>`}
function setupId(){let f=$('#idForm');if(!f)return;let saved={};try{saved=JSON.parse(localStorage.getItem('kkorg_idsettings')||'{}')}catch{};Object.entries(saved).forEach(([k,v])=>{if(f.elements[k]&&typeof v==='string'&&f.elements[k].type!=='file')f.elements[k].value=v});const colors=['Black (Default)','White','Navy','Blue','Red','Green','Gold','Gray'];function makeRows(type,arr,containerId){let target=$('#'+containerId);if(!target)return;let old=saved.headers?.[type]||{};target.innerHTML=arr.map((name,i)=>{let v=old[name]||{};return `<tr><td><input type="checkbox" data-type="${type}" data-header="${esc(name)}" ${v.selected?'checked':''} aria-label="Select ${esc(name)}"></td><td>${i+1}</td><td><input class="header-label" data-type="${type}" data-header="${esc(name)}" value="${esc(v.label||name)}" style="width:115px;min-width:100px;padding:7px;border:1px solid #dce2ed;border-radius:6px"></td><td><select data-prop="hcolor" data-type="${type}" data-header="${esc(name)}">${colors.map(c=>`<option ${((v.hcolor||'Black (Default)')===c)?'selected':''}>${c}</option>`).join('')}</select></td><td><select data-prop="vcolor" data-type="${type}" data-header="${esc(name)}">${colors.map(c=>`<option ${((v.vcolor||'Black (Default)')===c)?'selected':''}>${c}</option>`).join('')}</select></td><td><select data-prop="hbold" data-type="${type}" data-header="${esc(name)}"><option ${!v.hbold?'selected':''}>No</option><option ${v.hbold?'selected':''}>Yes</option></select></td><td><select data-prop="vbold" data-type="${type}" data-header="${esc(name)}"><option ${!v.vbold?'selected':''}>No</option><option ${v.vbold?'selected':''}>Yes</option></select></td></tr>`}).join('')};makeRows('emp',emp,'empHeaderRows');makeRows('stu',stu,'stuHeaderRows');function readHeaders(){let result={emp:{},stu:{}};f.querySelectorAll('[data-header]').forEach(el=>{let type=el.dataset.type,name=el.dataset.header;result[type][name]=result[type][name]||{selected:false,label:name,hcolor:'Black (Default)',vcolor:'Black (Default)',hbold:false,vbold:false};if(el.type==='checkbox')result[type][name].selected=el.checked;else if(el.dataset.prop)result[type][name][el.dataset.prop]=el.value;else if(el.classList.contains('header-label'))result[type][name].label=el.value});return result}function updatePreview(){let d=new FormData(f),headers=readHeaders(),type=d.get('cardType')==='Employee / Staff ID Card'?'emp':'stu',chosen=Object.values(headers[type]).filter(x=>x.selected),p=$('#idPreview');p.className='id-preview '+(d.get('orientation')==='Vertical'?'vertical ':'')+(d.get('photoShape')==='Circle'?'circle':'');p.innerHTML=`<div class="preview-photo">PHOTO</div><h3>${esc(d.get('headerTitle')||d.get('orgName')||'KK ORGANISATION')}</h3>${chosen.length?chosen.map(v=>`<p style="color:${colorValue(v.hcolor)};font-weight:${v.hbold?'700':'400'}">${esc(v.label)}: <span style="color:${colorValue(v.vcolor)};font-weight:${v.vbold?'700':'400'}">Sample ${esc(v.label)}</span></p>`).join(''):'<p>Select headers above to preview them here.</p>'}<div style="clear:both;border-top:1px dashed #bbb;margin-top:12px;padding-top:8px;font-size:11px">${esc(d.get('side')||'Single Side')} · Validity: ${esc(d.get('validity')||'—')}</div>`}function colorValue(c){return ({'Black (Default)':'#202b40','White':'#fff','Navy':'#14233f','Blue':'#1769e8','Red':'#c62828','Green':'#16805d','Gold':'#b58a20','Gray':'#748097'})[c]||'#202b40'}$('#previewBtn').onclick=updatePreview;f.onsubmit=e=>{e.preventDefault();let d=Object.fromEntries(new FormData(f).entries());['idFront','reportFront','reportBack'].forEach(k=>delete d[k]);d.headers=readHeaders();localStorage.setItem('kkorg_idsettings',JSON.stringify(d));saved=d;updatePreview();toast('ID Card settings saved in this browser')};$('#printBtn').onclick=()=>{updatePreview();window.print()};$('#idResetBtn').onclick=()=>setTimeout(()=>{makeRows('emp',emp,'empHeaderRows');makeRows('stu',stu,'stuHeaderRows');updatePreview()},0);f.addEventListener('change',e=>{if(e.target.matches('input[type="checkbox"][data-header]'))updatePreview()});updatePreview()}
function render(){editState=editState||null;$('#topTitle').textContent=currentPage;document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage));if(currentPage==='Dashboard'){pageContent.innerHTML=dashboard();return}if(configs[currentPage]){let c=configs[currentPage],ln=currentPage==='Add New School'?'School Record':'Organization Record';pageContent.innerHTML=`<h1>${c.title}</h1><div class="muted">Enter details below to add or update a record.</div>${formPanel(c.title,c.fields,editState?'Update Record':'Save Record')}${tablePanel('Recently Added',c.key,lists[ln].cols)}${currentPage==='Add New School'?idSettings():`<div class="panel"><div class="panel-head"><h2>ID Card Settings</h2><button class="btn secondary" onclick="go('ID Card Configuration')">Open ID Card Configuration</button></div><p class="muted">Configure card orientation, photo layout, selected fields and print options.</p></div>`}`;bindForm(c.key);bindSearch(c.key,lists[ln].cols);if(currentPage==='Add New School'){setupId();setupLocationDropdowns()}return}if(currentPage==='ID Card Configuration'){pageContent.innerHTML=idSettings();setupId();return}if(currentPage==='Add Staff'||currentPage==='Add Student'){let isStaff=currentPage==='Add Staff',key=isStaff?'staff':'students';pageContent.innerHTML=`<h1>${isStaff?'Add Employee / Staff':'Add Student'}</h1>${formPanel(isStaff?'Staff Details':'Student Details',[field('Full Name','name','text',true),...(isStaff?[field('Employee ID','empid','text',true),field('Department','department'),field('Designation','designation'),field('Joining Date','joining','date'),field('Mobile Number','mobile','tel'),field('Email','email','email'),field('Address','address','textarea')]:[field('Student ID','studentid','text',true),field('Class','class'),field('Course','course'),field('Section','section'),field('Date of Birth','dob','date'),field("Father's Name",'father'),field('Mobile Number','mobile','tel'),field('Address','address','textarea')])],editState?'Update Record':'Save Record')}`;bindForm(key);return}if(lists[currentPage]){let c=lists[currentPage];pageContent.innerHTML=`<h1>${c.title}</h1><div class="muted">Search, edit and manage available records.</div>${currentPage==='Wallet History'?`<div class="panel"><h2>Add Wallet Entry</h2><form id="walletForm"><div class="form-grid">${field('Amount','amount','number',true)}${field('Type','type','select',true,['Credit','Debit'])}${field('Balance','balance','number')}${field('Date','date','date',true)}${field('User ID','userId')}${field('Organization Name','organization')}${field('Remark','remark','text')}</div><div class="actions"><button class="btn">Add Wallet Entry</button></div></form></div>`:''}${tablePanel(c.title,c.key,c.cols)}${['Emp/Staff Record','Student Record'].includes(currentPage)?`<div class="actions"><button class="btn" onclick="go('${currentPage==='Emp/Staff Record'?'Add Staff':'Add Student'}')">＋ Add New</button><button class="btn secondary" onclick="go('ID Card Configuration')">ID Card Configuration</button></div>`:''}`;if(currentPage==='Wallet History')bindWallet();bindSearch(c.key,c.cols);return}if(currentPage==='All Passwords'){pageContent.innerHTML=`<h1>Account Management</h1><div class="panel"><h2>Secure Account Management</h2><p class="muted">For safety, passwords must never be shown in plain text. This frontend-only version does not manage real user credentials.</p><div class="form-grid">${field('Account / User ID','accountUser')}${field('Account Role','accountRole','select',false,['Administrator','Organization','School','Staff'])}</div><div class="actions"><button class="btn" onclick="toast('Connect a secure authentication backend to manage accounts')">Manage Account</button></div></div>`;return}if(currentPage==='Change Password'){pageContent.innerHTML=`<h1>Change Password</h1><div class="panel"><form id="passwordForm"><div class="form-grid">${field('Current Password','current','password',true)}${field('New Password','next','password',true)}${field('Confirm New Password','confirm','password',true)}</div><div class="actions"><button class="btn">Validate Change</button></div></form><div class="notice">Demo only: this validates the form but does not change a real account password. Secure password changes require a backend.</div></div>`;$('#passwordForm').onsubmit=e=>{e.preventDefault();let f=e.target;if(f.next.value.length<8)return toast('New password must be at least 8 characters');if(f.next.value!==f.confirm.value)return toast('New passwords do not match');toast('Form validated; connect authentication backend to apply change');f.reset()};return}if(currentPage==='Public Website'){pageContent.innerHTML=`<h1>KK ORGANISATION</h1><div class="panel"><h2>Welcome to KK ORGANISATION</h2><p class="muted">School, organization, staff and student management.</p><div class="actions"><button class="btn" onclick="go('Register')">Register Now</button><button class="btn secondary" onclick="go('Login')">Login</button><button class="btn light" onclick="go('Dashboard')">Return to Admin Preview</button></div></div>`;return}if(currentPage==='Register'){pageContent.innerHTML=`<h1>Register Now</h1>${formPanel('Create an account',[field('Organization / School Name','name','text',true),field('Contact Person','owner','text',true),field('Mobile Number','mobile','tel',true),field('Email Address','email','email',true),field('Create Password','password','password',true)],'Submit Registration')}<div class="notice">Demo registration only. No account or password is created until a secure backend is connected.</div>`;$('#recordForm').onsubmit=e=>{e.preventDefault();toast('Registration form validated; backend required to create account')};return}if(currentPage==='Login'){pageContent.innerHTML=`<h1>Login</h1>${formPanel('Login to portal',[field('User ID / Email','user','text',true),field('Password','password','password',true)],'Login')}<div class="notice">Demo login only. Real authentication is not enabled in this static frontend.</div>`;$('#recordForm').onsubmit=e=>{e.preventDefault();records.logins.unshift({user:e.target.user.value,date:stamp(),status:'Demo attempt'});saveData('logins');toast('Demo login attempt recorded; no real authentication performed')};return}pageContent.innerHTML=`<h1>${esc(currentPage)}</h1><div class="panel"><p class="muted">This section is available in the frontend preview.</p></div>`}
function setupLocationDropdowns(){let f=$('#recordForm');if(!f||!f.elements.state||!f.elements.region||!f.elements.district)return;let state=f.elements.state,region=f.elements.region,district=f.elements.district;const data={'Uttar Pradesh':{'Western UP':['Agra','Aligarh','Etah','Firozabad','Hathras','Mathura','Mainpuri','Meerut','Ghaziabad','Noida','Bulandshahr','Etawah','Kasganj','Bareilly','Moradabad','Saharanpur','Muzaffarnagar','Bijnor','Rampur','Amroha','Shamli','Baghpat','Hapur','Sambhal','Badaun','Pilibhit','Shahjahanpur'],'Central UP':['Lucknow','Kanpur Nagar','Kanpur Dehat','Unnao','Hardoi','Sitapur','Lakhimpur Kheri','Raebareli','Farrukhabad','Kannauj','Auraiya','Jalaun','Jhansi','Lalitpur'],'Eastern UP':['Varanasi','Prayagraj','Gorakhpur','Azamgarh','Ballia','Mau','Jaunpur','Ghazipur','Mirzapur','Sonbhadra','Chandauli','Deoria','Kushinagar','Basti','Sant Kabir Nagar','Siddharthnagar','Ayodhya','Ambedkar Nagar','Sultanpur','Amethi','Pratapgarh','Kaushambi','Gonda','Balrampur','Bahraich','Shravasti','Barabanki']} ,'Delhi':{'Delhi Region':['Central Delhi','East Delhi','New Delhi','North Delhi','North East Delhi','North West Delhi','Shahdara','South Delhi','South East Delhi','South West Delhi','West Delhi']},'Haryana':{'North Haryana':['Ambala','Kurukshetra','Panchkula','Yamunanagar','Kaithal'],'South Haryana':['Gurugram','Faridabad','Palwal','Rewari','Nuh','Mahendragarh'],'Central Haryana':['Hisar','Rohtak','Karnal','Panipat','Sonipat','Jind','Bhiwani','Charkhi Dadri','Fatehabad','Sirsa']},'Rajasthan':{'Jaipur Region':['Jaipur','Alwar','Dausa','Sikar','Jhunjhunu'],'Other Rajasthan':['Ajmer','Jodhpur','Udaipur','Kota','Bikaner','Bharatpur','Jaisalmer','Barmer','Chittorgarh']},'Madhya Pradesh':{'Central MP':['Bhopal','Sehore','Vidisha','Raisen'],'Other MP':['Indore','Gwalior','Jabalpur','Ujjain','Sagar','Rewa','Satna','Dewas']},'Bihar':{'Patna Region':['Patna','Nalanda','Bhojpur','Buxar'],'Other Bihar':['Gaya','Muzaffarpur','Darbhanga','Bhagalpur','Purnia','Begusarai']},'Punjab':{'Majha':['Amritsar','Gurdaspur','Pathankot'],'Doaba':['Jalandhar','Hoshiarpur','Kapurthala','Nawanshahr'],'Malwa':['Ludhiana','Patiala','Bathinda','Moga','Firozpur','Sangrur']},'Uttarakhand':{'Garhwal':['Dehradun','Haridwar','Pauri Garhwal','Tehri Garhwal','Uttarkashi','Chamoli','Rudraprayag'],'Kumaon':['Nainital','Almora','Bageshwar','Champawat','Pithoragarh','Udham Singh Nagar']}};function fillRegions(){let old=region.value;region.innerHTML='<option value="">Select Region</option>';Object.keys(data[state.value]||{}).forEach(x=>region.add(new Option(x,x)));region.disabled=!state.value;fillDistricts();if(old&&[...region.options].some(o=>o.value===old))region.value=old}function fillDistricts(){let old=district.value;district.innerHTML='<option value="">Select District</option>';((data[state.value]||{})[region.value]||[]).forEach(x=>district.add(new Option(x,x)));district.disabled=!region.value;if(old&&[...district.options].some(o=>o.value===old))district.value=old}state.addEventListener('change',()=>{region.value='';district.value='';fillRegions()});region.addEventListener('change',()=>{district.value='';fillDistricts()});region.disabled=true;district.disabled=true;fillRegions()}
function bindForm(k){let f=$('#recordForm');if(!f)return;f.onsubmit=e=>{e.preventDefault();let data=Object.fromEntries(new FormData(f).entries());data.created=editState&&records[k][editState.index]?.created||stamp();if(editState&&editState.key===k){records[k][editState.index]=data;editState=null}else records[k].unshift(data);saveData(k);render();toast('Record saved in this browser')}}function bindWallet(){let f=$('#walletForm');if(f)f.onsubmit=e=>{e.preventDefault();records.wallet.unshift({...Object.fromEntries(new FormData(f).entries()),date:new FormData(f).get('date')||new Date().toISOString().slice(0,10)});saveData('wallet');render();toast('Wallet entry saved in this browser')}}function bindSearch(k,cols){let i=$('#tableSearch');if(!i)return;i.oninput=()=>{let q=i.value.toLowerCase(),a=records[k].map((r,index)=>({...r,__index:index})).filter(r=>cols.some(c=>String(r[c[0]]||'').toLowerCase().includes(q)));$('#tableBody').innerHTML=a.length?a.map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c[0]]||'—')}</td>`).join('')}<td><button class="btn secondary" onclick="editRecord('${k}',${r.__index})">Edit</button> <button class="btn danger" onclick="delRecord('${k}',${r.__index})">Delete</button></td></tr>`).join(''):`<tr><td colspan="${cols.length+1}" class="empty">No matching records</td></tr>`}}
function go(p){currentPage=p;render();$('#sidebar').classList.remove('open');let map={'Add New School':'schoolMenu','School Record':'schoolMenu','Add New Organization':'organizationMenu','Organization Record':'organizationMenu','Wallet History':'organizationMenu','Emp/Staff Record':'staffMenu','Add Staff':'staffMenu','Student Record':'studentMenu','Add Student':'studentMenu','All Passwords':'settingsMenu','Change Password':'settingsMenu','Login History':'settingsMenu','Website Visit History':'settingsMenu','ID Card Configuration':'settingsMenu'};if(map[p]){$('#'+map[p]).hidden=false;document.querySelector(`[data-toggle="${map[p]}"]`)?.classList.add('expanded')}records.visits.unshift({page:p,date:stamp(),note:'Page opened in this browser'});if(records.visits.length>100)records.visits.pop();saveData('visits')}
document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let m=$('#'+b.dataset.toggle),open=m.hidden;document.querySelectorAll('.submenu').forEach(x=>x.hidden=true);document.querySelectorAll('.nav-group').forEach(x=>x.classList.remove('expanded'));if(open){m.hidden=false;b.classList.add('expanded')}});$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');$('#logoutBtn').onclick=()=>{records.logins.unshift({user:'Administrator',date:stamp(),status:'Demo logout click'});saveData('logins');go('Dashboard');toast('Preview only: no real login session')};$('#year').textContent=new Date().getFullYear();render();
</script></body></html>
